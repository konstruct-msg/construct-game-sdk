name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components and the wasm32 target;
      # rustup installs them on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --locked --release --target wasm32-unknown-unknown --workspace -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Builds every game and fails if a hash differs from GAMES.sha256, which was
      # written on a developer's machine: this step is the cross-machine half of the
      # reproducibility check.
      - name: Build games, compare hashes
        run: scripts/build-games.sh

      - name: Reproducible across paths
        run: scripts/check-reproducible.sh
