name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components and the wasm32 target;
      # rustup installs them on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --locked --all-targets -- -D warnings

      # The host never runs inside wasm; only what a game links is checked for wasm32.
      - name: Clippy (wasm32)
        run: cargo clippy --locked --release --target wasm32-unknown-unknown --workspace --exclude construct-games-host -- -D warnings

      # The reference build: this runner is x86_64 Linux, the host the hashes in
      # GAMES.sha256 are defined for. Fails if a hash differs; when a change moves one
      # on purpose, the new hash is in this step's log. Before the tests, because the
      # host's differential test runs the built module from dist/.
      - name: Build games, compare hashes
        run: scripts/build-games.sh

      - name: Upload the reference modules
        uses: actions/upload-artifact@v4
        with:
          name: games
          path: dist/

      - name: Tests
        run: cargo test --locked

      - name: Reproducible across paths
        run: scripts/check-reproducible.sh
